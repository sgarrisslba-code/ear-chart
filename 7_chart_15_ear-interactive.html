arseInt(window.getComputedStyle(labels[0]).marginTop)+parseInt(window.getComputedStyle(labels[0]).marginBottom);const singleRowHeight=labelHeight+labelMargin;const visibleDrawerHeight=singleRowHeight*CONFIG.VISIBLE_LABEL_ROWS+20;drawerElement.visibleHeight=visibleDrawerHeight;drawerElement.style.height="auto";const totalHeight=drawerContent.offsetHeight+70;drawerHeight=totalHeight;drawerElement.style.height=`${totalHeight}px`;if(!isDrawerOpen){drawerElement.style.bottom=`-${drawerHeight-visibleDrawerHeight}px`}else{drawerElement.style.bottom=`${CONFIG.DRAWER_BOTTOM_PADDING}px`}}function populateDrawer(){if(!drawerContent)return;drawerContent.innerHTML="";CONFIG.CATEGORIES.forEach(label=>{const labelDiv=document.createElement("div");labelDiv.className="label";const paragraph=document.createElement("p");paragraph.textContent=label;labelDiv.appendChild(paragraph);drawerContent.appendChild(labelDiv);makeDraggable(labelDiv)})}function setupEventListeners(){if(labelsButton){labelsButton.addEventListener("click",toggleDrawer)}if(trashElement){trashElement.addEventListener("click",clearAllLabels)}}function toggleDrawer(){const visibleDrawerHeight=drawerElement.visibleHeight||40;if(isDrawerOpen){drawerElement.style.bottom=`-${drawerHeight-visibleDrawerHeight}px`;mainContent.style.transform="scale(1)";mainContentScale=1;mainContent.addEventListener("transitionend",function handler(){repositionLabelsAfterScaleChange();mainContent.removeEventListener("transitionend",handler)},{once:true})}else{drawerElement.style.bottom="0";mainContent.style.transformOrigin="top center";mainContent.style.transform="scale(0.8)";mainContentScale=.8;mainContent.addEventListener("transitionend",function handler(){repositionLabelsAfterScaleChange();mainContent.removeEventListener("transitionend",handler)},{once:true})}isDrawerOpen=!isDrawerOpen}function repositionLabelsAfterScaleChange(){const labels=document.querySelectorAll(".label-clone");const actualMainContentScale=getComputedScale(mainContent) ntrols.remove();elementToRemove.remove()}else{document.querySelectorAll(".draggable-clone").forEach(element=>{if(element.controls)element.controls.remove();element.remove()})}document.getElementById("confirmation-modal").style.display="none";document.getElementById("confirm-yes").onclick=null;document.getElementById("confirm-no").onclick=null};document.getElementById("confirm-no").onclick=function(){document.getElementById("confirmation-modal").style.display="none";document.getElementById("confirm-yes").onclick=null;document.getElementById("confirm-no").onclick=null}}function getComputedScale(element){const transform=getComputedStyle(element).transform;if(transform&&transform!=="none"){const matrix=new DOMMatrixReadOnly(transform);return matrix.a}return 1}function makeDraggable(element){element.addEventListener("pointerdown",startDrag);function startDrag(e){if(e.button!==0&&e.pointerType==="mouse"){return}if(e.target.classList.contains("scale-control")||e.target.classList.contains("rotate")||e.target.classList.contains("resize")||e.target.closest(".tools")){return}e.preventDefault();e.stopPropagation();const clientX=e.clientX;const clientY=e.clientY;let movingElement;let offsetFromElementCenterToMouseX;let offsetFromElementCenterToMouseY;const actualMainContentScale=getComputedScale(mainContent);const labelAreaRect=labelPlacementArea.getBoundingClientRect();if(!element.classList.contains("draggable-clone")){movingElement=element.cloneNode(true);movingElement.classList.add("draggable-clone");movingElement.style.position="absolute";movingElement.style.top="0";movingElement.style.left="0";movingElement.style.zIndex="1000";const uniqueId=`clone-${cloneCounter++}`;movingElement.id=uniqueId;labelPlacementArea.appendChild(movingElement);addControls(movingElement,uniqueId);makeDraggable(movingElement);movingElement.style.visibility="hidden";updateElementTransform(movingElement,{rotation:0,scale:1,translateX:0,translateY:0});document.body.offsetWidth;const newLabelInitialRec eToCenterV*cos}document.addEventListener("pointermove",onPointerMove);document.addEventListener("pointerup",stopDrag);document.addEventListener("pointercancel",stopDrag);function onPointerMove(e){const mouseX=e.clientX;const mouseY=e.clientY;const currentActualMainContentScale=getComputedScale(mainContent);const{rotation,scale}=movingElement.transformState;const currentLabelAreaRect=labelPlacementArea.getBoundingClientRect();const mouseXUnscaledRelativeToLabelArea=(mouseX-currentLabelAreaRect.left)/currentActualMainContentScale;const mouseYUnscaledRelativeToLabelArea=(mouseY-currentLabelAreaRect.top)/currentActualMainContentScale;let scaledOffsetX=offsetFromElementCenterToMouseX*scale;let scaledOffsetY=offsetFromElementCenterToMouseY*scale;const rad=rotation*(Math.PI/180);const cos=Math.cos(rad);const sin=Math.sin(rad);const rotatedScaledOffsetX=scaledOffsetX*cos-scaledOffsetY*sin;const rotatedScaledOffsetY=scaledOffsetX*sin+scaledOffsetY*cos;let desiredCenterUnscaledX=mouseXUnscaledRelativeToLabelArea-rotatedScaledOffsetX;let desiredCenterUnscaledY=mouseYUnscaledRelativeToLabelArea-rotatedScaledOffsetY;const originalLabelScale=movingElement.transformState.scale;movingElement.transformState.scale=1;updateElementTransform(movingElement,movingElement.transformState);const elementIntrinsicWidth=movingElement.offsetWidth;const elementIntrinsicHeight=movingElement.offsetHeight;movingElement.transformState.scale=originalLabelScale;let newUnscaledPxX=desiredCenterUnscaledX-elementIntrinsicWidth*originalLabelScale/2;let newUnscaledPxY=desiredCenterUnscaledY-elementIntrinsicHeight*originalLabelScale/2;const unscaledLabelAreaWidth=currentLabelAreaRect.width/currentActualMainContentScale;const unscaledLabelAreaHeight=currentLabelAreaRect.height/currentActualMainContentScale;const renderedLabelWidthAtMainScale1=elementIntrinsicWidth*originalLabelScale;const renderedLabelHeightAtMainScale1=elementIntrinsicHeight*originalLabelScale;newUnscaledPxX=Math.max(0,Math.min(newUnscaledPxX,unscaledLabelAreaWidth-renderedLabelWidthAtMainScale1));newUnscaledPxY=Math.max(0,Math.min(newUnscaledPxY,unscaledLabelAreaHeight-renderedLabelHeightAtMainScale1));movingElement.transformState.translateX=newUnscaledPxX;movingElement.transformState.translateY=newUnscaledPxY;updateElementTransform(movingElement,movingElement.transformState);movingElement.dataset.unscaledPxX=newUnscaledPxX;movingElement.dataset.unscaledPxY=newUnscaledPxY;if(movingElement.controls&&movingElement.transformState&&movingElement.transformState.controlsVisible){const updatedElementRect=movingElement.getBoundingClientRect();movingElement.controls.style.left=`${updatedElementRect.left+updatedElementRect.width/2}px`;movingElement.controls.style.top=`${updatedElementRect.bottom+15}px`}e.preventDefault();if(trashElement){checkTrashHover(movingElement)}}function stopDrag(){document.removeEventListener("pointermove",onPointerMove);document.removeEventListener("pointerup",stopDrag);document.removeEventListener("pointercancel",stopDrag);repositionLabelsAfterScaleChange();if(isOverTrash(movingElement)){if(movingElement.controls){movingElement.controls.remove()}movingElement.remove()}else if(!element.classList.contains("draggable-clone")&&isFirstLabelDropped){addTooltipToLabel(movingElement);isFirstLabelDropped=false}if(trashElement){trashElement.style.backgroundColor="";trashElement.style.transform="scale(1)"}}}}function addControls(element,id){const controls=document.createElement("div");controls.className="tools";controls.style.display="none";controls.style.position="fixed";const rotateControl=document.createElement("div");rotateControl.className="rotate";rotateControl.innerHTML="↻";rotateControl.style.cursor="grab";const scaleControl=document.createElement("div");scaleControl.className="resize";scaleControl.innerHTML="⤢";scaleControl.style.cursor="grab";controls.appendChild(rotateControl);controls.appendChild(scaleControl);document.body.appendChild(controls);const transformState={rotation:0,scale ventDefault();const rect=element.getBoundingClientRect();const centerX=rect.left+rect.width/2;const centerY=rect.top+rect.height/2;const startX=e.clientX-centerX;const startY=e.clientY-centerY;const startAngle=Math.atan2(startY,startX)*(180/Math.PI);const initialRotation=transformState.rotation;const pointerId=e.pointerId;rotateControl.setPointerCapture(pointerId);rotateControl.addEventListener("pointermove",onRotateMove);rotateControl.addEventListener("pointerup",stopRotation);rotateControl.addEventListener("pointercancel",stopRotation);function onRotateMove(e){if(e.pointerId!==pointerId)return;const newX=e.clientX-centerX;const newY=e.clientY-centerY;const currentAngle=Math.atan2(newY,newX)*(180/Math.PI);const angleDelta=currentAngle-startAngle;const newRotation=Math.round((initialRotation+angleDelta)/CONFIG.ROTATION_SNAP)*CONFIG.ROTATION_SNAP;transformState.rotation=newRotation;updateElementTransform(element,transformState)}function stopRotation(e){if(e.pointerId!==pointerId)return;rotateControl.removeEventListener("pointermove",onRotateMove);rotateControl.removeEventListener("pointerup",stopRotation);rotateControl.removeEventListener("pointercancel",stopRotation);rotateControl.releasePointerCapture(pointerId)}}}function setupScaling(scaleControl,element,transformState){scaleControl.addEventListener("pointerdown",startScaling);function startScaling(e){e.stopPropagation();e.preventDefault();const startX=e.clientX;const initialScale=transformState.scale;const pointerId=e.pointerId;scaleControl.setPointerCapture(pointerId);scaleControl.addEventListener("pointermove",onScaleMove);scaleControl.addEventListener("pointerup",stopScaling);scaleControl.addEventListener("pointercancel",stopScaling);function onScaleMove(e){if(e.pointerId!==pointerId)return;const deltaX=e.clientX-startX;const scaleChange=deltaX*.005;let newScale=initialScale+scaleChange;newScale=Math.max(CONFIG.MIN_SCALE,Math.min(CONFIG.MAX_SCALE,newScale));transformState.scale=newScale;updateElementTransform(element,transformState)}function stopScaling(e){if(e.pointerId!==pointerId)return;scaleControl.removeEventListener("pointermove",onScaleMove);scaleControl.removeEventListener("pointerup",stopScaling);scaleControl.removeEventListener("pointercancel",stopScaling);scaleControl.releasePointerCapture(pointerId)}}}function updateElementTransform(element,state){element.style.transform=`translate(${state.translateX}px, ${state.translateY}px) rotate(${state.rotation}deg) scale(${state.scale})`}function isOverTrash(element){if(!trashElement)return false;const trashRect=trashElement.getBoundingClientRect();const elementRect=element.getBoundingClientRect();const centerX=elementRect.left+elementRect.width/2;const centerY=elementRect.top+elementRect.height/2;return centerX>=trashRect.left&&centerX<=trashRect.right&&centerY>=trashRect.top&&centerY<=trashRect.bottom}function checkTrashHover(element){if(!trashElement)return;if(isOverTrash(element)){trashElement.style.backgroundColor=CONFIG.TRASH_HIGHLIGHT_COLOR;trashElement.style.transform=`scale(${CONFIG.TRASH_HIGHLIGHT_SCALE})`}else{trashElement.style.backgroundColor="";trashElement.style.transform="scale(1)"}}init()});</script>
